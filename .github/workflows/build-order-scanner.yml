name: Build Order Scanner APK

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Android project
        shell: bash
        run: |
          cat project.b64.part-* | base64 -d > project.zip
          unzip -q project.zip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Download Russian OCR model
        working-directory: OrderScannerAndroid
        shell: bash
        run: |
          mkdir -p app/src/main/assets/tessdata
          curl -L --fail --retry 3 \
            https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/main/rus.traineddata \
            -o app/src/main/assets/tessdata/rus.traineddata

      - name: Build debug APK
        working-directory: OrderScannerAndroid
        shell: bash
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OrderScanner-debug-apk
          path: OrderScannerAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
